<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musaq Traders | Exclusive Kurtas & Kurti Sets — Hyderabad</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #14110f;
            --bg-dark-soft: #1f1a17;
            --gold: #c59b6d;
            --gold-light: #e4c197;
            --cream: #faf7f4;
            --white: #ffffff;
            --text-main: #1f1b18;
            --text-muted: #655b52;
            --border-soft: #e8ddd1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--cream);
            color: var(--text-main);
            line-height: 1.65;
        }

        /* Announcement Top Strip */
        .top-announcement {
            background-color: #0d0b0a;
            color: var(--gold-light);
            text-align: center;
            padding: 8px 4%;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(197, 155, 109, 0.25);
        }

        /* Main Header */
        header {
            background: linear-gradient(135deg, #14110f 0%, #241c17 100%);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            border-bottom: 1px solid var(--gold);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
        }

        .logo-frame {
            background: #0d0b0a;
            padding: 6px 12px;
            border-radius: 10px;
            border: 1px solid rgba(197, 155, 109, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-frame img {
            height: 56px;
            width: auto;
            max-width: 95px;
            object-fit: contain;
            display: block;
        }

        .brand-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.05rem;
            font-weight: 700;
            color: var(--gold-light);
            line-height: 1.05;
        }

        .brand-tag {
            font-size: 0.78rem;
            color: #e6dcd2;
            letter-spacing: 0.4px;
            margin-top: 2px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 22px;
            flex-wrap: wrap;
        }

        .nav-links {
            display: flex;
            gap: 22px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: #f5efe9;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 400;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--gold-light);
        }

        .search-wrap {
            background: #28211c;
            border: 1px solid #4a3d34;
            border-radius: 25px;
            padding: 7px 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-wrap input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 0.85rem;
            width: 155px;
        }

        .search-wrap i {
            color: var(--gold);
            font-size: 0.9rem;
        }

        /* Hero Banner */
        .hero {
            position: relative;
            min-height: 490px;
            background: linear-gradient(90deg, rgba(20, 17, 15, 0.92) 0%, rgba(20, 17, 15, 0.68) 58%, rgba(20, 17, 15, 0.48) 100%),
                        url('https://images.unsplash.com/photo-1583391733956-6c78276477e2?auto=format&fit=crop&w=1400&q=80') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 65px 6%;
            overflow: hidden;
        }

        .hero-content {
            max-width: 630px;
            color: #ffffff;
            z-index: 2;
        }

        .badge {
            display: inline-block;
            background: rgba(197, 155, 109, 0.18);
            border: 1px solid var(--gold);
            color: var(--gold-light);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.82rem;
            margin-bottom: 16px;
        }

        .hero-content h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.1rem;
            line-height: 1.12;
            margin-bottom: 16px;
            color: #ffffff;
        }

        .hero-content p {
            color: #ede4db;
            font-size: 1rem;
            margin-bottom: 28px;
        }

        .hero-buttons {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .btn-gold {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--gold);
            color: #14110f;
            padding: 13px 26px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.92rem;
            transition: 0.3s;
        }

        .btn-gold:hover {
            background: var(--gold-light);
        }

        .btn-outline {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: 1px solid var(--gold-light);
            color: #ffffff;
            padding: 13px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.92rem;
            transition: 0.3s;
        }

        .btn-outline:hover {
            background: rgba(197, 155, 109, 0.2);
        }

        .watermark-box {
            z-index: 1;
            opacity: 0.22;
            pointer-events: none;
        }

        .watermark-box img {
            width: 240px;
            height: auto;
            object-fit: contain;
        }

        /* Features Strip */
        .highlights {
            background: var(--white);
            border-bottom: 1px solid var(--border-soft);
            padding: 28px 6%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            text-align: center;
        }

        .highlight-item {
            padding: 10px;
        }

        .highlight-item i {
            color: #b0824f;
            font-size: 1.45rem;
            margin-bottom: 8px;
        }

        .highlight-item h4 {
            font-size: 0.98rem;
            color: var(--text-main);
            margin-bottom: 3px;
        }

        .highlight-item p {
            font-size: 0.83rem;
            color: var(--text-muted);
        }

        /* Section Generic */
        .section {
            padding: 70px 6%;
            max-width: 1280px;
            margin: auto;
        }

        .section-top {
            text-align: center;
            margin-bottom: 36px;
        }

        .section-top h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            color: var(--text-main);
        }

        .section-top p {
            color: var(--text-muted);
            font-size: 0.96rem;
            max-width: 650px;
            margin: 8px auto 0;
        }

        /* Filter Tabs */
        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 36px;
        }

        .filter-btn {
            background: var(--white);
            border: 1px solid #d8c8b8;
            color: var(--text-main);
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
        }

        .filter-btn.active,
        .filter-btn:hover {
            background: var(--bg-dark);
            color: var(--gold-light);
            border-color: var(--bg-dark);
        }

        /* Kurtas Grid */
        .kurti-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 28px;
        }

        .kurti-card {
            background: var(--white);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-soft);
            box-shadow: 0 6px 20px rgba(31, 27, 24, 0.05);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
        }

        .kurti-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 14px 30px rgba(31, 27, 24, 0.11);
        }

        .img-wrapper {
            position: relative;
            width: 100%;
            height: 340px;
            overflow: hidden;
            background: #f3ece4;
        }

        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s;
        }

        .kurti-card:hover .img-wrapper img {
            transform: scale(1.04);
        }

        .tag-pill {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(20, 17, 15, 0.85);
            color: var(--gold-light);
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(197, 155, 109, 0.5);
        }

        .kurti-info {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .kurti-info h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.45rem;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .kurti-info p {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .kurti-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            color: #8a5e2b;
            font-weight: 600;
            border-top: 1px solid #f2eae1;
            padding-top: 10px;
            margin-bottom: 14px;
        }

        .card-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-inquire {
            text-align: center;
            padding: 9px 10px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 500;
            text-decoration: none;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-insta {
            background: var(--bg-dark);
            color: var(--gold-light);
            border: 1px solid var(--bg-dark);
        }

        .btn-insta:hover {
            background: #2b231e;
        }

        .btn-mail {
            background: var(--cream);
            color: var(--text-main);
            border: 1px solid #d5c3b1;
        }

        .btn-mail:hover {
            background: #efe6dc;
        }

        /* Wholesale & Retail Dual Banner */
        .trade-section {
            background: linear-gradient(135deg, #1b1613 0%, #2b221c 100%);
            color: #ffffff;
            padding: 65px 6%;
        }

        .trade-inner {
            max-width: 1200px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
            gap: 28px;
        }

        .trade-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(197, 155, 109, 0.35);
            border-radius: 12px;
            padding: 30px;
        }

        .trade-box h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            color: var(--gold-light);
            margin-bottom: 10px;
        }

        .trade-box p {
            font-size: 0.92rem;
            color: #e4dad0;
            margin-bottom: 16px;
        }

        .trade-list {
            list-style: none;
        }

        .trade-list li {
            font-size: 0.88rem;
            color: #f3ece4;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .trade-list li i {
            color: var(--gold);
        }

        /* Store Info & Contact Section */
        .store-card {
            background: var(--white);
            border: 1px solid var(--border-soft);
            border-radius: 14px;
            padding: 38px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 30px;
            align-items: center;
        }

        .store-details h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .store-details p {
            color: var(--text-muted);
            font-size: 0.94rem;
            margin-bottom: 14px;
        }

        .contact-pills {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .contact-pill {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--cream);
            padding: 13px 18px;
            border-radius: 8px;
            border: 1px solid var(--border-soft);
            text-decoration: none;
            color: var(--text-main);
            font-size: 0.92rem;
            font-weight: 500;
            transition: 0.3s;
        }

        .contact-pill:hover {
            border-color: var(--gold);
            background: #f5ede4;
        }

        .contact-pill i {
            color: #a87944;
            font-size: 1.15rem;
        }

        /* Footer */
        footer {
            background: var(--bg-dark);
            color: #e6dcd2;
            padding: 55px 6% 25px;
            border-top: 2px solid var(--gold);
        }

        .footer-grid {
            max-width: 1280px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 34px;
            padding-bottom: 32px;
            border-bottom: 1px solid #2d2520;
        }

        .footer-col h4 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.45rem;
            color: var(--gold-light);
            margin-bottom: 14px;
        }

        .footer-col p,
        .footer-col a {
            color: #d3c7bc;
            font-size: 0.9rem;
            text-decoration: none;
            display: block;
            margin-bottom: 8px;
        }

        .footer-col a:hover {
            color: var(--gold-light);
        }

        .social-row {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .social-row a {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #241c17;
            border: 1px solid var(--gold);
            color: var(--gold-light);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.05rem;
            transition: 0.3s;
        }

        .social-row a:hover {
            background: var(--gold);
            color: #14110f;
        }

        .bottom-bar {
            text-align: center;
            padding-top: 22px;
            font-size: 0.85rem;
            color: #9e9185;
        }

        @media (max-width: 768px) {
            .hero-content h1 {
                font-size: 2.25rem;
            }
            .watermark-box {
                display: none;
            }
            .search-wrap {
                width: 100%;
            }
            .search-wrap input {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Top Announcement -->
    <div class="top
