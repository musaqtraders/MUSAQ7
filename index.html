<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSAQ | Ladies Fashion</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #051c17;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-video {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0;
            filter: brightness(0.58);
        }

        .video-tint {
            position: fixed;
            inset: 0;
            background: rgba(5, 28, 23, 0.45);
            z-index: 1;
        }

        .center-stage {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 36px 20px;
            gap: 22px;
        }

        .center-logo {
            width: 190px;
            max-width: 65vw;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.55));
        }

        .shop-btn {
            background: #ffffff;
            color: #051c17;
            text-decoration: none;
            padding: 14px 42px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.35);
            transition: transform 0.2s;
        }

        .shop-btn:hover {
            transform: translateY(-2px);
        }

        .insta-btn {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            color: #ffffff;
            text-decoration: none;
            background: rgba(5, 28, 23, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.35);
            padding: 10px 22px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <video class="bg-video" autoplay muted loop playsinline>
        <source src="YTShort_23Nov2026_17_51_18.mp4" type="video/mp4">
    </video>
    <div class="video-tint"></div>

    <main class="center-stage">
        <img src="5956-removebg-preview.png" alt="MUSAQ Logo" class="center-logo" onerror="this.style.display='none'">

        <a href="shop.html" class="shop-btn">Shop Now</a>

        <a href="https://instagram.com/musaqind" target="_blank" class="insta-btn">
            <i class="fab fa-instagram"></i>
            <span>@musaqind</span>
        </a>
    </main>

</body>
</html>
