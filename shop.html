<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSAQ | Shop Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f2f8f5;
            color: #08211b;
        }

        .top-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #051c17;
            color: #ffffff;
            padding: 10px 4%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        .brand-box img {
            height: 44px;
            width: auto;
            object-fit: contain;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-link-btn {
            text-decoration: none;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.35);
            padding: 6px 13px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .nav-link-btn.ig {
            background: #ffffff;
            color: #051c17;
            border-color: #ffffff;
            font-weight: 600;
        }

        .shop-container {
            max-width: 1360px;
            margin: 0 auto;
            padding: 26px 4% 56px;
        }

        .shop-heading {
            text-align: center;
            margin-bottom: 24px;
        }

        .shop-heading h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .shop-heading p {
            font-size: 0.85rem;
            color: #49635c;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .item-card {
            background: #ffffff;
            border: 1px solid #c9ddd6;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 6px 18px rgba(8, 33, 27, 0.05);
        }

        .item-photo {
            width: 100%;
            height: 310px;
            background: #e5efe9;
            overflow: hidden;
        }

        .item-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .item-body {
            padding: 14px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
            gap: 10px;
        }

        .item-cat {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #144d40;
        }

        .item-title {
            font-size: 1rem;
            font-weight: 600;
            color: #08211b;
            margin-top: 2px;
        }

        .price-size-line {
            background: #f2f8f5;
            border: 1px solid #d5e6df;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price-val {
            font-weight: 700;
            color: #051c17;
        }

        .size-val {
            font-weight: 600;
            color: #2c4740;
        }

        .ig-order-btn {
            text-decoration: none;
            background: #051c17;
            color: #ffffff;
            padding: 9px 10px;
            border-radius: 7px;
            font-size: 0.78rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <header class="top-header">
        <a href="index.html" class="brand-box">
            <img src="5956-removebg-preview.png" alt="MUSAQ Logo" onerror="this.style.display='none'">
            <span>MUSAQ</span>
        </a>

        <div class="nav-right">
            <a href="index.html" class="nav-link-btn"><i class="fas fa-home"></i> Home</a>
            <a href="https://instagram.com/musaqind" target="_blank" class="nav-link-btn ig"><i class="fab fa-instagram"></i> @musaqind</a>
        </div>
    </header>

            { cat: 'Night Suit', title: 'Soft Alpine Satin Collar Nightwear', price: '₹410', size: 'M, L, XL, XXL', img: 'https://images.pexels.com/photos/1462637/pexels-photo-1462637.jpeg?auto=compress&cs=tinysrgb&w=700' },
            { cat: 'Night Suit', title: 'Women Floral Kaftan Night Suit', price: '₹365', size: 'L, XL, XXL', img: 'https://images.pexels.com/photos/1183266/pexels-photo-1183266.jpeg?auto=compress&cs=tinysrgb&w=700' }

        const grid = document.getElementById('grid');

        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.innerHTML = `
                <div class="item-photo">
                    <img src="${item.img}" alt="${item.title}" loading="lazy">
                </div>
                <div class="item-body">
                    <div>
                        <div class="item-cat">${item.cat}</div>
                        <div class="item-title">${item.title}</div>
                    </div>
                    <div class="price-size-line">
                        <span class="price-val">Price: ${item.price}</span>
                        <span class="size-val">Size: ${item.size}</span>
                    </div>
                    <a href="https://instagram.com/musaqind" target="_blank" class="ig-order-btn">
                        <i class="fab fa-instagram"></i> Order on Instagram
                    </a>
                </div>
            `;
            grid.appendChild(card);
        });
    </script>

</body>
  </html>
