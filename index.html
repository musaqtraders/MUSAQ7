<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSAQ | Kurtas Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #ebe6df;
            color: #2b2420;
            line-height: 1.5;
        }

        .page-wrap {
            max-width: 540px;
            margin: 0 auto;
            background: #e8e2da;
            min-height: 100vh;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
        }

        /* Top Dark Brand Hero */
        .hero-dark {
            background-color: #23201e;
            color: #ffffff;
            text-align: center;
            padding: 44px 24px 36px;
        }

        .hero-logo {
            width: 110px;
            height: 110px;
            object-fit: contain;
            margin: 0 auto 12px;
            display: block;
        }

        .brand-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.3rem;
            letter-spacing: 5px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .brand-sub {
            font-size: 0.72rem;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #cfc5ba;
            margin-bottom: 28px;
        }

        .kurti-showcase {
            width: 100%;
            max-width: 340px;
            margin: 0 auto;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: #181513;
        }

        .kurti-showcase img {
            width: 100%;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            display: block;
        }

        .kurti-caption {
            padding: 14px;
            text-align: center;
            background: #2b2623;
        }

        .kurti-caption h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .kurti-caption p {
            font-size: 0.85rem;
            color: #dfd5ca;
        }

        /* Stay Updated Form Section (Beige/Cream like screenshot) */
        .signup-section {
            background-color: #e8e2da;
            padding: 48px 28px;
            text-align: center;
        }

        .signup-section h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: 1px;
            line-height: 1.15;
            color: #3a322d;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .signup-section .lead {
            font-size: 0.9rem;
            color: #5c524b;
            max-width: 320px;
            margin: 0 auto 24px;
        }

        .divider-line {
            width: 180px;
            height: 1.5px;
            background: #4a3f38;
            margin: 0 auto 26px;
        }

        .form-box {
            max-width: 380px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .form-box input,
        .form-box textarea {
            width: 100%;
            background: #ffffff;
            border: 1px solid #d5cdc2;
            padding: 13px 15px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.9rem;
            color: #2b2420;
            outline: none;
        }

        .form-box input::placeholder,
        .form-box textarea::placeholder {
            color: #9a9086;
        }

        .form-box textarea {
            min-height: 100px;
            resize: vertical;
        }

        .submit-btn {
            background: #e6dfd5;
            border: 1.5px solid #4a3f38;
            color: #3a322d;
            padding: 14px 20px;
            font-size: 0.92rem;
            font-weight: 500;
            cursor: pointer;
            margin-top: 6px;
            transition: all 0.25s;
        }

        .submit-btn:hover {
            background: #3a322d;
            color: #ffffff;
        }

        .form-note {
            font-size: 0.72rem;
            color: #6b6159;
            margin-top: 8px;
        }

        /* Brown Footer with Big Clean Social Icons */
        .footer-brown {
            background-color: #695349;
            color: #f5efe8;
            text-align: center;
            padding: 36px 24px 40px;
        }

        .footer-brown p {
            font-size: 0.92rem;
            margin-bottom: 24px;
            color: #f3ece4;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 36px;
        }

        .social-icons a {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.65rem;
            transition: transform 0.2s, opacity 0.2s;
        }

        .social-icons a:hover {
            transform: scale(1.12);
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <div class="page-wrap">

        <!-- Dark Top Section with MUSAQ Logo & Kurti -->
        <section class="hero-dark">
            <img src="5956-removebg-preview.png" alt="MUSAQ Logo" class="hero-logo" onerror="this.style.display='none'">
            <div class="brand-title">MUSAQ</div>
            <div class="brand-sub">Kurtas • Wholesale & Retail</div>

            <div class="kurti-showcase">
                <img src="kurti1.jpg" alt="MUSAQ Kurti Set" onerror="this.src='https://images.unsplash.com/photo-1610030469983-98e550d6193c?auto=format&fit=crop&w=800&q=85'">
                <div class="kurti-caption">
                    <h3>Mauve Scallop Kurti Set</h3>
                    <p>Size: XL, XXL • Wholesale Rate: ₹440</p>
                </div>
            </div>
        </section>

        <!-- Stay Updated / Order Inquiry Section -->
        <section class="signup-section">
            <h2>STAY<br>UPDATED</h2>
            <p class="lead">Sign up and be the first to know when new kurtas arrive.</p>
            <div class="divider-line"></div>

            <form class="form-box" onsubmit="sendOrderMail(event)">
                <input type="text" id="firstName" placeholder="First name*" required>
                <input type="text" id="lastName" placeholder="Last name*" required>
                <input type="email" id="email" placeholder="Email address*" required>
                <input type="tel" id="phone" placeholder="Phone number*" required>
                <textarea id="message" placeholder="Message* (e.g. Kurti name, Size XL/XXL, Qty)" required></textarea>
                <button type="submit" class="submit-btn">Sign Up</button>
                <p class="form-note">Direct inquiry sent to musaqtraders@gmail.com</p>
            </form>
        </section>

        <!-- Brown Footer with Facebook, Instagram & Gmail Icons -->
        <footer class="footer-brown">
            <p>© 2026 Musaq Traders. All Rights Reserved.</p>
            <div class="social-icons">
                <a href="https://www.facebook.com/" target="_blank" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="https://instagram.com/musaqind" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="mailto:musaqtraders@gmail.com" aria-label="Gmail"><i class="fas fa-envelope"></i></a>
            </div>
        </footer>

    </div>

    <script>
        function sendOrderMail(e) {
            e.preventDefault();
            const fn = document.getElementById('firstName').value;
            const ln = document.getElementById('lastName').value;
            const em = document.getElementById('email').value;
            const ph = document.getElementById('phone').value;
            const msg = document.getElementById('message').value;

            const subject = encodeURIComponent(`MUSAQ Inquiry - ${fn} ${ln}`);
            const body = encodeURIComponent(
                `Name: ${fn} ${ln}\nEmail: ${em}\nPhone: ${ph}\n\nMessage:\n${msg}`
            );

            window.location.href = `mailto:musaqtraders@gmail.com?subject=${subject}&body=${body}`;
        }
    </script>

</body>
    </html>
