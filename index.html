<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSAQ | Kurtas</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #23201e;
            color: #ffffff;
            line-height: 1.5;
        }

        .page-wrap {
            max-width: 540px;
            margin: 0 auto;
            background-color: #23201e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Top Dark Brand Section */
        .hero-dark {
            background-color: #23201e;
            text-align: center;
            padding: 46px 22px 44px;
        }

        .hero-logo {
            width: 150px;
            height: 150px;
            object-fit: contain;
            margin: 0 auto 12px;
            display: block;
        }

        .brand-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            letter-spacing: 5px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .brand-sub {
            font-size: 0.75rem;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #d6ccc2;
            margin-bottom: 32px;
        }

        /* Kurti Photo Card */
        .kurti-card {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            border-radius: 10px;
            overflow: hidden;
            background: #2b2623;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .kurti-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        .kurti-details {
            padding: 16px;
            text-align: center;
            background: #2b2623;
        }

        .kurti-details h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.45rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .kurti-details p {
            font-size: 0.9rem;
            color: #e6dcd2;
            font-weight: 500;
        }

        /* Brown Footer with Social Icons */
        .footer-brown {
            background-color: #695349;
            color: #f5efe8;
            text-align: center;
            padding: 36px 24px 40px;
        }

        .footer-brown p {
            font-size: 0.92rem;
            margin-bottom: 24px;
            color: #f3ece4;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 36px;
        }

        .social-icons a {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.65rem;
            transition: transform 0.2s, opacity 0.2s;
        }

        .social-icons a:hover {
            transform: scale(1.12);
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <div class="page-wrap">

        <!-- Dark Top Section with Large MUSAQ Logo & Your Kurti -->
        <section class="hero-dark">
            <img src="5956-removebg-preview.png" alt="MUSAQ Logo" class="hero-logo" onerror="this.style.display='none'">
            <div class="brand-title">MUSAQ</div>
            <div class="brand-sub">Kurtas • Wholesale & Retail</div>

            <div class="kurti-card">
                <img src="IMG-20261122-WA0001.jpg" alt="MUSAQ Mauve Kurti Set">
                <div class="kurti-details">
                    <h3>Mauve Scallop Kurti Set</h3>
                    <p>Size: XL, XXL • Wholesale Rate: ₹440</p>
                </div>
            </div>
        </section>

        <!-- Brown Footer with Facebook, Instagram & Gmail -->
        <footer class="footer-brown">
            <p>© 2026 Musaq Traders. All Rights Reserved.</p>
            <div class="social-icons">
                <a href="https://www.facebook.com/" target="_blank" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="https://instagram.com/musaqind" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="mailto:musaqtraders@gmail.com" aria-label="Gmail"><i class="fas fa-envelope"></i></a>
            </div>
        </footer>

    </div>

</body>
</html>
